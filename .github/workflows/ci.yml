name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      # The built site, served under the repository path the way GitHub Pages serves it, must load with no 404s.
      - run: npx playwright install --with-deps chromium
      - run: npm run check:dist
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages must be switched on once by hand: Settings → Pages → Build and deployment → Source: "GitHub Actions"
      # (the workflow's own token may not create the site — enablement: true fails with a 403). After that every
      # push to main publishes; this step just reads the site's configuration.
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
