<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Tidewater</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=IBM+Plex+Sans:wght@400;500&display=swap" />
    <style>
      :root {
        --sky: #cfe6f2;
        --panel: rgba(18, 34, 46, 0.72);
        --panel-line: rgba(255, 255, 255, 0.10);
        --ink: #f3f1ea;
        --ink-dim: rgba(243, 241, 234, 0.62);
        --accent: #ffd18a;
        --track: rgba(255, 255, 255, 0.18);
        --water: #3f8fa8;
        --bad: #e08a7a;
        color-scheme: dark;
      }
      html, body { height: 100%; }
      body { margin: 0; background: var(--sky); overflow: hidden; font-family: "IBM Plex Sans", system-ui, sans-serif; color: var(--ink); }
      #c { width: 100%; height: 100%; display: block; outline: none; touch-action: none; cursor: crosshair; }

      .glass {
        background: var(--panel); border: 1px solid var(--panel-line);
        backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
        border-radius: 10px; box-sizing: border-box; user-select: none;
      }
      #hud {
        position: fixed; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
        width: min(320px, calc(100vw - 32px));
        padding: 14px 16px 16px; display: grid; gap: 12px;
      }
      #hud h1 { font: 400 26px/1 "Instrument Serif", Georgia, serif; margin: 0; letter-spacing: 0.01em; }
      label { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-dim); }
      #hud .hint { margin: 0; font-size: 11px; color: var(--ink-dim); line-height: 1.45; min-height: 16px; }
      #hud .hint.blocked { color: var(--bad); }

      #resources { position: fixed; left: 16px; top: 16px; display: flex; flex-wrap: wrap; gap: 8px 18px; padding: 8px 14px; max-width: calc(50vw - 250px); }
      #resources .res { display: grid; gap: 1px; }
      #resources .res-group { display: flex; gap: 18px; padding-left: 14px; border-left: 1px solid var(--panel-line); }
      #resources .res-group[data-role="luxury"] label { color: var(--accent); }
      #resources .res span { font: 400 18px/1.1 "Instrument Serif", Georgia, serif; font-variant-numeric: tabular-nums; }

      #notes { position: fixed; right: 16px; top: 16px; display: grid; gap: 4px; font-size: 12px; color: var(--ink-dim); text-align: right; pointer-events: none; }
      #notes div { background: var(--panel); border: 1px solid var(--panel-line); border-radius: 6px; padding: 4px 10px; }
      #notes div:last-child { color: var(--ink); }

      .tide { display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: center; }
      .tide svg { display: block; }
      .tide-level { fill: var(--water); opacity: 0.85; }
      .tide-track { stroke: var(--track); stroke-width: 2; }
      .tide-tick { stroke: var(--ink-dim); stroke-width: 1.5; }
      .tide-marker { fill: var(--accent); }
      .tide-value { font: 400 22px/1.1 "Instrument Serif", Georgia, serif; font-variant-numeric: tabular-nums; }
      .tide-sub { font-size: 11px; color: var(--ink-dim); margin-top: 3px; font-variant-numeric: tabular-nums; }
      .tide-spring { font-size: 11px; color: var(--ink-dim); margin-top: 2px; }
      .tide-spring.now { color: var(--accent); }
      #hud .hint.warn { color: var(--accent); }

      .tabs { display: flex; gap: 4px; flex-wrap: wrap; }
      .tabs button {
        font: inherit; font-size: 11px; letter-spacing: 0.04em; color: var(--ink-dim); background: transparent;
        border: 1px solid transparent; border-radius: 6px; padding: 4px 8px; cursor: pointer;
      }
      .tabs button:hover { color: var(--ink); }
      .tabs button.active { color: var(--accent); border-color: rgba(255, 209, 138, 0.4); background: rgba(255, 209, 138, 0.08); }
      .tabs button.inspect { margin-left: auto; border-color: var(--panel-line); }
      body.mobile .tabs button.inspect { display: none; }
      #info .pill { display: inline-block; padding: 1px 8px; border-radius: 9px; line-height: 1.5; }
      #info .pill.ok { background: rgba(121, 173, 94, 0.22); color: #cfe8b8; }
      #info .pill.warn { background: rgba(255, 184, 89, 0.2); color: #ffd18a; }
      #info .pill.bad { background: rgba(224, 138, 122, 0.22); color: #f2b5a8; }
      .palette { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
      .palette button[hidden] { display: none; }
      .palette button .reason { grid-column: 1; font-size: 10px; color: var(--bad); }
      .palette button .reason:empty { display: none; }
      .palette button {
        font: inherit; font-size: 12px; color: var(--ink); background: rgba(255, 255, 255, 0.06);
        border: 1px solid var(--panel-line); border-radius: 6px; padding: 6px 7px; min-width: 0; overflow: hidden;
        display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-auto-rows: auto; column-gap: 6px; align-items: center; text-align: left; cursor: pointer;
      }
      .palette button .name { grid-column: 1; overflow-wrap: anywhere; }
      .palette button .cost { grid-column: 1; font-size: 10px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
      .palette button kbd { grid-column: 2; grid-row: 1 / span 3; font: 10px/1 "IBM Plex Sans", system-ui, sans-serif; color: var(--ink-dim); border: 1px solid var(--track); border-radius: 3px; padding: 2px 4px; }
      .palette button kbd:empty { display: none; }
      .palette button:hover { background: rgba(255, 255, 255, 0.11); }
      .palette button.active { background: rgba(255, 209, 138, 0.16); border-color: var(--accent); color: var(--accent); }
      .palette button.active kbd { color: var(--accent); border-color: rgba(255, 209, 138, 0.5); }
      .palette button.unaffordable { opacity: 0.45; }
      .palette button.unaffordable .cost { color: var(--bad); }

      #tutorial { position: fixed; left: 50%; top: 16px; transform: translateX(-50%); width: min(440px, calc(100vw - 32px)); padding: 10px 14px 12px; font-size: 12px; color: var(--ink); border-color: rgba(255, 209, 138, 0.35); }
      #tutorial[hidden] { display: none; }
      #tutorial .tut-head { display: flex; justify-content: space-between; align-items: center; }
      #tutorial .tut-step { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
      #tutorial .skip { font: inherit; font-size: 11px; color: var(--ink-dim); background: transparent; border: 1px solid var(--panel-line); border-radius: 6px; padding: 2px 8px; cursor: pointer; }
      #tutorial .skip:hover { color: var(--ink); }
      #tutorial h3 { margin: 4px 0 2px; font: 400 18px/1.1 "Instrument Serif", Georgia, serif; }
      #tutorial p { margin: 0; line-height: 1.45; color: var(--ink); }
      #tutorial.bare .tut-head, #tutorial.bare h3 { display: none; }
      #tutorial.bare p { color: var(--ink-dim); }
      #markerLabel { position: fixed; transform: translate(-50%, -140%); padding: 3px 9px; font-size: 11px; color: #1b2a33; background: var(--accent); border-radius: 6px; pointer-events: none; white-space: nowrap; }
      #markerLabel[hidden] { display: none; }
      #costTag { position: fixed; transform: translate(14px, -50%); padding: 3px 9px; font-size: 12px; font-weight: 600; color: #1b2a33; background: rgba(247, 243, 232, .94); border-radius: 6px; pointer-events: none; white-space: nowrap; box-shadow: 0 1px 4px rgba(0, 0, 0, .3); z-index: 6; }
      #costTag.warn { background: var(--accent); }
      #costTag.blocked { background: #d9604b; color: #fff; }
      #costTag[hidden] { display: none; }
      .pulse { animation: pulse 1.2s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(255, 209, 138, 0.0); border-color: var(--accent); } 50% { box-shadow: 0 0 0 4px rgba(255, 209, 138, 0.25); border-color: var(--accent); } }
      @media (prefers-reduced-motion: reduce) { .pulse { animation: none; border-color: var(--accent); } }
      #speed { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: flex; gap: 4px; padding: 6px 8px; }
      #speed button { font: inherit; font-size: 12px; color: var(--ink-dim); background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 4px 10px; cursor: pointer; min-width: 40px; }
      #speed button:hover { color: var(--ink); }
      #speed button.active { color: var(--accent); border-color: rgba(255, 209, 138, 0.4); background: rgba(255, 209, 138, 0.08); }
      #speed .menu-open { margin-left: 6px; }
      #speed .mute { min-width: 32px; }
      #speed .reflections { font-size: 11px; }
      #menu { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(420px, calc(100vw - 32px)); padding: 14px 16px 16px; display: grid; gap: 10px; z-index: 2; }
      #menu[hidden] { display: none; }
      #settings { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(460px, calc(100vw - 32px)); padding: 14px 16px 16px; display: grid; gap: 10px; z-index: 2; }
      #settings[hidden] { display: none; }
      .presets { display: grid; gap: 6px; }
      .preset { display: grid; gap: 2px; text-align: left; font: inherit; color: var(--ink); background: rgba(255, 255, 255, 0.06); border: 1px solid var(--panel-line); border-radius: 8px; padding: 8px 10px; cursor: pointer; }
      .preset:hover { background: rgba(255, 255, 255, 0.1); }
      .preset.active { color: var(--accent); border-color: rgba(255, 209, 138, 0.5); background: rgba(255, 209, 138, 0.08); }
      .preset-name { font-size: 13px; }
      .preset-desc { font-size: 11px; color: var(--ink-dim); }
      .settings-note { margin: 0; font-size: 11px; color: var(--ink-dim); min-height: 1em; }
      .menu-head { display: flex; justify-content: space-between; align-items: center; }
      .menu-head h2 { font: 400 22px/1 "Instrument Serif", Georgia, serif; margin: 0; }
      .menu-head .close { font: 16px/1 system-ui; color: var(--ink-dim); background: transparent; border: 0; cursor: pointer; }
      .sector-line { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; }
      .sector-name { color: var(--ink-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .sector-line .world, .menu-actions button { font: inherit; font-size: 11px; color: var(--ink); background: rgba(255, 255, 255, 0.06); border: 1px solid var(--panel-line); border-radius: 6px; padding: 3px 8px; cursor: pointer; }
      .sector-line .world { color: var(--accent); border-color: rgba(255, 209, 138, 0.4); }
      .menu-actions { display: flex; justify-content: flex-end; align-items: center; gap: 6px; }
      .seed-field { margin-right: auto; display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--ink-dim); }
      .seed-field input { width: 84px; font: inherit; font-size: 11px; color: var(--ink); background: rgba(255, 255, 255, 0.06); border: 1px solid var(--panel-line); border-radius: 6px; padding: 3px 6px; }
      .playtest { display: grid; gap: 6px; border-top: 1px solid var(--panel-line); padding-top: 10px; }
      .playtest-switch { font-size: 11px; color: var(--ink-dim); display: flex; align-items: center; gap: 6px; }
      .playtest-notes { font: inherit; font-size: 11px; color: var(--ink); background: rgba(255, 255, 255, 0.06); border: 1px solid var(--panel-line); border-radius: 6px; padding: 4px 6px; resize: vertical; }
      #info { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: 260px; padding: 12px 16px 14px; display: grid; gap: 8px; }
      #info[hidden] { display: none; }
      .info-head { display: flex; justify-content: space-between; align-items: center; }
      .info-head h2 { font: 400 20px/1 "Instrument Serif", Georgia, serif; margin: 0; }
      .info-head .close { font: 16px/1 system-ui; color: var(--ink-dim); background: transparent; border: 0; cursor: pointer; }
      .info-body { display: grid; gap: 4px; }
      .info-body .row { display: flex; justify-content: space-between; font-size: 12px; }
      .info-body .row span { font-variant-numeric: tabular-nums; }
      .info-orders { margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(255, 255, 255, 0.1); }
      .info-orders h3 { margin: 0 0 4px; font: 500 12px/1.2 "IBM Plex Sans", system-ui, sans-serif; color: var(--accent); }
      .info-orders .order-row { align-items: center; margin-top: 3px; }
      .info-orders .order-good { font: inherit; font-size: 11px; color: var(--ink); background: rgba(255, 255, 255, 0.06); border: 1px solid var(--panel-line); border-radius: 6px; padding: 2px 8px; cursor: pointer; }
      .info-orders .order-good:disabled { opacity: 0.45; cursor: default; }
      #info .repair { font: inherit; font-size: 12px; color: #f2b5a8; background: rgba(224, 138, 122, 0.12); border: 1px solid rgba(224, 138, 122, 0.5); border-radius: 8px; padding: 6px 10px; cursor: pointer; text-align: center; }
      #info .repair:hover:not(:disabled) { background: rgba(224, 138, 122, 0.22); }
      #info .repair:disabled { color: var(--ink-dim); background: transparent; border-color: var(--panel-line); cursor: default; }
      #info .repair[hidden] { display: none; }
      #info .upgrade { font: inherit; font-size: 12px; color: var(--accent); background: rgba(255, 209, 138, 0.08); border: 1px solid rgba(255, 209, 138, 0.4); border-radius: 8px; padding: 6px 10px; cursor: pointer; text-align: center; }
      #info .upgrade:hover:not(:disabled) { background: rgba(255, 209, 138, 0.16); }
      #info .upgrade:disabled { color: var(--ink-dim); background: transparent; border-color: var(--panel-line); cursor: default; }
      #info .upgrade[hidden] { display: none; }
      .info-body .desc { margin: 4px 0 0; font-size: 11px; color: var(--ink-dim); }
      .info-body .district { margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(255, 255, 255, 0.1); font-size: 11px; color: var(--ink-dim); }
      .info-body .district h3 { margin: 0 0 2px; font-size: 13px; font-weight: 600; color: var(--ink); }
      .overlays { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
      .overlays label { margin-right: 4px; }
      .overlays .overlay-legend { flex-basis: 100%; margin: 4px 0 0; font-size: 11px; line-height: 1.45; color: var(--ink-dim); }
      .overlays button {
        font: inherit; font-size: 11px; color: var(--ink-dim); background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--panel-line); border-radius: 6px; padding: 3px 8px; cursor: pointer;
      }
      .overlays button.active { color: var(--accent); border-color: rgba(255, 209, 138, 0.4); }
      .score { border-top: 1px solid var(--panel-line); padding-top: 10px; display: grid; gap: 4px; }
      .tide-ship { font-size: 11px; color: var(--ink-dim); margin-top: 2px; }
      .tide-event { font-size: 11px; color: var(--ink-dim); margin-top: 2px; }
      .tide-event.now { color: var(--bad); }
      .tide-event:empty { display: none; }
      .trade-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 11px; color: var(--ink-dim); min-height: 18px; }
      .trade-row .order { font: inherit; font-size: 11px; color: var(--ink); background: rgba(255, 255, 255, 0.06); border: 1px solid var(--panel-line); border-radius: 6px; padding: 3px 8px; cursor: pointer; }
      .trade-row .order[hidden] { display: none; }
      .loan-row:has(.loan[hidden]):has(.loan-status:empty) { display: none; }
      .score-value { font-size: 13px; }
      .score-value.flash { animation: flash 1.2s ease-out; }
      @keyframes flash { 0% { color: var(--accent); } 100% { color: var(--ink); } }
      @media (prefers-reduced-motion: reduce) { .score-value.flash { animation: none; } }
      #achievement { position: fixed; left: 50%; bottom: 76px; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; padding: 10px 18px 10px 14px; border-color: rgba(255, 209, 138, 0.45); animation: rise 0.5s ease-out; }
      #achievement[hidden] { display: none; }
      #achievement .star { font-size: 22px; color: var(--accent); }
      #achievement h3 { margin: 0; font-size: 13px; font-weight: 600; }
      #achievement p { margin: 2px 0 0; font-size: 11px; color: var(--ink-dim); }
      @keyframes rise { 0% { opacity: 0; transform: translate(-50%, -8px); } 100% { opacity: 1; transform: translate(-50%, 0); } }
      @media (prefers-reduced-motion: reduce) { #achievement { animation: none; } }

      /* ---------- the World (docs/globe) ---------- */
      body[data-mode="world"] #hud, body[data-mode="world"] #resources, body[data-mode="world"] #notes, body[data-mode="world"] #tutorial,
      body[data-mode="world"] #achievement, body[data-mode="world"] #markerLabel, body[data-mode="world"] #costTag, body[data-mode="world"] #speed, body[data-mode="world"] #info { display: none; }
      body[data-mode="world"] #c { cursor: grab; }
      body[data-mode="world"] #c.hovering { cursor: pointer; }
      body[data-mode="world"] #c.dragging { cursor: grabbing; }
      #veil { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
      #veil[hidden] { display: none; }
      body.arriving #resources, body.arriving #notes, body.arriving #tutorial, body.arriving #speed, body.arriving #hud { animation: arrive 450ms ease-out; }
      @keyframes arrive { from { opacity: 0; } to { opacity: 1; } }
      #world[hidden] { display: none; }
      #world { position: fixed; inset: 0; pointer-events: none; }
      #world .glass, #world button, #world input { pointer-events: auto; }
      #world.fading { opacity: 0; transition: opacity 250ms ease-out; }
      #world.fading * { pointer-events: none; } /* invisible during a flight, so not clickable either */
      #world { transition: opacity 250ms ease-out; }
      .world-title { position: absolute; left: 24px; top: 20px; }
      .world-title h1 { margin: 0; font: 400 44px/1 "Instrument Serif", Georgia, serif; letter-spacing: 0.01em; color: var(--ink); text-shadow: 0 1px 12px rgba(10, 30, 45, 0.35); }
      .world-sub { margin: 6px 0 0 2px; font-size: 13px; color: var(--ink-dim); text-shadow: 0 1px 8px rgba(10, 30, 45, 0.45); }
      .world-card { position: absolute; right: 24px; top: 50%; transform: translateY(-50%); width: min(300px, calc(100vw - 48px)); padding: 16px 18px 18px; display: grid; gap: 10px; }
      .world-card[hidden] { display: none; }
      .world-card.reveal { animation: cardIn 220ms ease-out; }
      @keyframes cardIn { 0% { opacity: 0; transform: translateY(calc(-50% + 6px)); } 100% { opacity: 1; transform: translateY(-50%); } }
      .card-kicker { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-dim); }
      .card-name { margin: 0; font: 400 26px/1.1 "Instrument Serif", Georgia, serif; }
      .card-rows { display: grid; gap: 4px; }
      .card-rows .row { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-dim); }
      .card-rows .row span:last-child { color: var(--ink); font-variant-numeric: tabular-nums; }
      .card-field { display: grid; gap: 4px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-dim); }
      .card-field input, .seed-row input { font: inherit; font-size: 13px; letter-spacing: 0; text-transform: none; color: var(--ink); background: rgba(255, 255, 255, 0.06); border: 1px solid var(--panel-line); border-radius: 6px; padding: 5px 8px; width: 100%; box-sizing: border-box; }
      .seed-row { display: flex; gap: 6px; }
      .seed-row input { flex: 1; min-width: 0; }
      .biomes { display: flex; flex-wrap: wrap; gap: 4px; }
      .card-actions { display: flex; flex-wrap: wrap; gap: 6px; padding-top: 4px; }
      .world-card button, .world-actions button, .biome { font: inherit; font-size: 12px; letter-spacing: 0; text-transform: none; color: var(--ink); background: rgba(255, 255, 255, 0.06); border: 1px solid var(--panel-line); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
      .world-card button:hover, .world-actions button:hover { background: rgba(255, 255, 255, 0.11); }
      .world-card button.primary { color: #1b2a33; background: var(--accent); border-color: var(--accent); }
      .world-card button.primary:hover { background: #ffdca4; }
      .biome.active { color: var(--accent); border-color: rgba(255, 209, 138, 0.5); background: rgba(255, 209, 138, 0.08); }
      .biome.uncharted { opacity: 0.45; cursor: default; display: grid; gap: 1px; text-align: left; }
      .biome.uncharted span { font-size: 10px; color: var(--ink-dim); }
      .biome-blurb { margin-top: 6px; font-size: 11px; color: var(--ink-dim); text-transform: none; letter-spacing: 0; }
      .world-bottom { position: absolute; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: grid; justify-items: center; gap: 8px; }
      .world-hint { font-size: 12px; color: var(--ink-dim); text-shadow: 0 1px 8px rgba(10, 30, 45, 0.45); white-space: nowrap; }
      .world-actions { padding: 6px 8px; }
      .world-notice { position: absolute; left: 50%; top: 20px; transform: translateX(-50%); padding: 8px 14px; font-size: 12px; color: var(--ink); max-width: min(520px, calc(100vw - 48px)); text-align: center; }
      .world-notice[hidden] { display: none; }
      .world-actions { display: flex; gap: 6px; }
      .world-actions button.active { color: var(--accent); border-color: rgba(255, 209, 138, 0.5); }
      .world-trade { position: absolute; left: 24px; top: 50%; transform: translateY(-50%); width: min(320px, calc(100vw - 48px)); max-height: 60vh; overflow-y: auto; padding: 14px 16px 16px; display: grid; gap: 10px; }
      .world-trade[hidden] { display: none; }
      .trade-section { display: grid; gap: 3px; }
      .trade-title { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-dim); }
      .trade-line { font-size: 12px; color: var(--ink); }
      @media (max-width: 720px) {
        .world-trade { left: 12px; right: 12px; top: 64px; transform: none; width: auto; max-height: 40vh; }
        .world-title { left: 50%; transform: translateX(-50%); text-align: center; top: 14px; }
        .world-title h1 { font-size: 34px; }
        .world-card { left: 12px; right: 12px; top: auto; bottom: calc(104px + env(safe-area-inset-bottom, 0px)); transform: none; width: auto; }
        @keyframes cardIn { 0% { opacity: 0; transform: translateY(6px); } 100% { opacity: 1; transform: none; } }
        .world-hint { font-size: 11px; white-space: normal; text-align: center; }
      }
      @media (prefers-reduced-motion: reduce) { .world-card.reveal { animation: none; } #world { transition: none; } }
      /* in-page dialogs */
      .dialog-host { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: rgba(6, 16, 24, 0.35); }
      .dialog-host[hidden] { display: none; }
      .dialog { width: min(380px, calc(100vw - 32px)); padding: 16px 18px; display: grid; gap: 12px; }
      .dialog-message { margin: 0; font-size: 13px; line-height: 1.45; }
      .dialog-input { font: inherit; font-size: 13px; color: var(--ink); background: rgba(255, 255, 255, 0.06); border: 1px solid var(--panel-line); border-radius: 6px; padding: 6px 8px; }
      .dialog-actions { display: flex; justify-content: flex-end; gap: 6px; }
      .dialog-actions button { font: inherit; font-size: 12px; color: var(--ink); background: rgba(255, 255, 255, 0.06); border: 1px solid var(--panel-line); border-radius: 6px; padding: 5px 12px; cursor: pointer; }
      .dialog-actions .dialog-ok { color: #1b2a33; background: var(--accent); border-color: var(--accent); }
      .dialog-actions .dialog-ok.danger { color: var(--ink); background: rgba(224, 138, 122, 0.25); border-color: var(--bad); }

      /* ---------- phones (ui/mobile.ts): the map first ----------
         Top: the resources in one scrolling row, then the tide in a line and the speed buttons. Bottom: the build
         categories and More; a category opens a one-row drawer of cards; a picked card shows the placing panel.
         The building sheet and More rise from the bottom. Nothing here applies without body.mobile. */
      #mstatus, #mbar, #mplace, #mmore { display: none; }
      body.mobile { -webkit-tap-highlight-color: transparent; }
      body.mobile button { touch-action: manipulation; }
      body.mobile #resources {
        left: 8px; right: 8px; top: calc(8px + env(safe-area-inset-top, 0px)); max-width: none;
        flex-wrap: nowrap; overflow-x: auto; gap: 14px; padding: 6px 12px; scrollbar-width: none;
      }
      body.mobile #resources::-webkit-scrollbar { display: none; }
      body.mobile #resources .res, body.mobile #resources .res-group { flex: none; }
      body.mobile #resources .res-group { order: 1; }
      body.mobile #resources .res-group { gap: 14px; padding-left: 12px; }
      body.mobile #resources label { font-size: 9px; }
      body.mobile #resources .res span { font-size: 16px; }
      body.mobile[data-mode="island"] #mstatus {
        display: flex; align-items: center; gap: 6px; position: fixed; left: 8px; right: 8px;
        top: calc(58px + env(safe-area-inset-top, 0px)); padding: 4px;
      }
      #mstatus .mtide {
        flex: 1; min-width: 0; min-height: 36px; text-align: left; font: inherit; font-size: 12px; color: var(--ink);
        background: transparent; border: 0; padding: 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer;
      }
      body.mobile #speed { position: static; transform: none; padding: 0; gap: 2px; background: none; border: 0; backdrop-filter: none; -webkit-backdrop-filter: none; }
      body.mobile #speed button { min-width: 38px; min-height: 36px; padding: 4px 6px; }
      body.mobile #tutorial {
        top: calc(108px + env(safe-area-inset-top, 0px)); width: calc(100vw - 16px); padding: 8px 12px 10px; cursor: pointer;
      }
      body.mobile #tutorial p { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      body.mobile #tutorial.open p { display: block; }
      body.mobile #tutorial .skip { min-height: 28px; }
      body.mobile #tutorial h3 { margin: 2px 0 2px; font-size: 17px; }
      body.mobile[data-mode="island"] #mbar {
        display: flex; position: fixed; left: 0; right: 0; bottom: 0; gap: 0; overflow-x: auto; scrollbar-width: none;
        padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px)); border-radius: 12px 12px 0 0; border-bottom: 0;
      }
      #mbar::-webkit-scrollbar { display: none; }
      #mbar button {
        flex: 1 1 auto; min-width: 0; min-height: 44px; padding: 0 3px; font: inherit; font-size: 11px;
        color: var(--ink-dim); background: transparent; border: 1px solid transparent; border-radius: 8px; cursor: pointer;
      }
      #mbar button.active { color: var(--accent); border-color: rgba(255, 209, 138, 0.4); background: rgba(255, 209, 138, 0.08); }
      body.mobile #hud {
        display: none; left: 0; right: 0; width: auto; bottom: calc(56px + env(safe-area-inset-bottom, 0px));
        padding: 10px; border-radius: 12px 12px 0 0;
      }
      body.mobile.drawer-open[data-mode="island"] #hud { display: block; }
      body.mobile #hud > :not(.palette) { display: none; }
      body.mobile #hud .palette {
        grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: 128px; overflow-x: auto; gap: 8px;
        scroll-snap-type: x proximity; scrollbar-width: none;
      }
      body.mobile #hud .palette::-webkit-scrollbar { display: none; }
      body.mobile #hud .palette button { min-height: 64px; padding: 8px 10px; font-size: 13px; scroll-snap-align: start; }
      body.mobile #hud .palette button kbd { display: none; }
      body.mobile.placing[data-mode="island"]:not(.drawer-open):not(.more-open) #mplace {
        display: grid; gap: 6px; position: fixed; left: 8px; right: 8px; bottom: calc(64px + env(safe-area-inset-bottom, 0px)); padding: 10px 12px;
      }
      #mplace .mtool { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
      #mplace .mname { font: 400 20px/1.1 "Instrument Serif", Georgia, serif; }
      #mplace .mclose { font: 20px/1 system-ui; color: var(--ink-dim); background: transparent; border: 0; min-width: 44px; min-height: 36px; cursor: pointer; }
      #mplace .mnote { font-size: 12px; color: var(--ink-dim); min-height: 16px; }
      #mplace .mnote.blocked { color: var(--bad); }
      #mplace .mactions { display: flex; gap: 6px; }
      #mplace .mactions button {
        min-height: 44px; min-width: 44px; padding: 0 12px; font: inherit; font-size: 13px; color: var(--ink);
        background: rgba(255, 255, 255, 0.06); border: 1px solid var(--panel-line); border-radius: 8px; cursor: pointer;
      }
      #mplace .mactions button[hidden] { display: none; }
      #mplace .mactions .mgo { flex: 1; color: #1b2a33; background: var(--accent); border-color: var(--accent); font-weight: 500; }
      #mplace .mactions .mgo:disabled { opacity: 0.35; }
      body.mobile.more-open[data-mode="island"] #mmore {
        display: grid; gap: 12px; position: fixed; left: 0; right: 0; bottom: 0; max-height: 80vh; overflow-y: auto; z-index: 3;
        padding: 14px 16px calc(16px + env(safe-area-inset-bottom, 0px)); border-radius: 12px 12px 0 0;
      }
      #mmore .close { min-width: 44px; min-height: 36px; font-size: 20px; }
      #mmore .overlays button { min-height: 36px; padding: 4px 10px; }
      #mmore .mrow { display: flex; flex-wrap: wrap; gap: 6px; border-top: 1px solid var(--panel-line); padding-top: 12px; }
      #mmore .mrow button, #mmore .trade-row .order {
        min-height: 40px; padding: 4px 12px; font: inherit; font-size: 12px; color: var(--ink);
        background: rgba(255, 255, 255, 0.06); border: 1px solid var(--panel-line); border-radius: 8px; cursor: pointer;
      }
      #mmore .mrow button.active { color: var(--accent); border-color: rgba(255, 209, 138, 0.4); }
      #info .remove { display: none; }
      body.mobile #info {
        left: 8px; right: 8px; width: auto; bottom: calc(64px + env(safe-area-inset-bottom, 0px)); max-height: 42vh; overflow-y: auto; z-index: 2;
      }
      body.mobile #info .close { min-width: 44px; min-height: 36px; font-size: 20px; }
      body.mobile #info .upgrade, body.mobile #info .repair { min-height: 40px; }
      body.mobile #info .remove {
        display: block; position: sticky; bottom: 0; min-height: 40px; margin-top: 4px; font: inherit; font-size: 12px; color: var(--bad);
        background: #2b3238; border: 1px solid rgba(224, 138, 122, 0.4); border-radius: 8px; cursor: pointer;
      }
      body.mobile #notes { left: 8px; right: 8px; top: auto; bottom: calc(64px + env(safe-area-inset-bottom, 0px)); text-align: center; }
      body.mobile #notes div { display: none; }
      body.mobile #notes div:last-child { display: block; }
      body.mobile.drawer-open #notes, body.mobile.placing #notes, body.mobile.more-open #notes, body.mobile:has(#info:not([hidden])) #notes { display: none; }
      body.mobile #achievement { bottom: calc(120px + env(safe-area-inset-bottom, 0px)); max-width: calc(100vw - 16px); }
      body.mobile #menu, body.mobile #settings { max-height: calc(100vh - 32px); overflow-y: auto; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="resources" class="glass"></div>
    <div id="notes"></div>
    <div id="tutorial" class="glass"></div>
    <div id="achievement" class="glass" hidden></div>
    <div id="markerLabel" hidden></div>
    <div id="speed" class="glass"></div>
    <div id="menu" class="glass" hidden></div>
    <div id="settings" class="glass" hidden></div>
    <div id="info" class="glass" hidden></div>
    <div id="hud" class="glass"></div>
    <div id="world" hidden></div>
    <div id="dialog" class="dialog-host" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
